<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заказ — Star Hit Cafe</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <header class="site-header py-3">
    <div class="container">
      <div class="d-flex justify-content-between align-items-center">
        <a class="navbar-brand site-header__logo mb-0" href="index.html">Star Hit Cafe</a>
        <nav class="navbar navbar-expand-lg navbar-dark p-0">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar"><span class="navbar-toggler-icon"></span></button>
          <div class="collapse navbar-collapse" id="mainNavbar">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
              <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
              <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
              <li class="nav-item"><a class="nav-link active" aria-current="page" href="order.html">Заказ</a></li>
            </ul>
          </div>
        </nav>
      </div>
    </div>
  </header>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header text-white" style="background-color: var(--color-surface); border-bottom: 2px solid var(--color-primary);">
            <h1 class="h4 mb-0">Оформление заказа</h1>
          </div>
          <div class="card-body">
            <div class="alert alert-info" role="alert">
              Заполните форму. Поля со звёздочкой (*) обязательны.
            </div>
            <form>
              <div class="row g-3">
                
                <div class="col-12 col-md-6">
                  <label for="order-name" class="form-label">Имя *</label>
                  <input id="order-name" name="name" type="text" class="form-control" placeholder="Введите ваше имя" required>
                </div>
                
                <div class="col-12 col-md-6">
                  <label for="order-email" class="form-label">E-mail *</label>
                  <input id="order-email" name="email" type="email" class="form-control" placeholder="example@mail.ru" required>
                </div>

                <div class="col-12 col-md-6">
                  <label for="order-phone" class="form-label">Телефон *</label>
                  <div class="input-group">
                    <span class="input-group-text">+7</span>
                    <input id="order-phone" name="phone" type="tel" class="form-control" placeholder="900 000-00-00" required>
                  </div>
                </div>

                <div class="col-12 col-md-6">
                  <label for="order-topic" class="form-label">Тема заявки *</label>
                  <select id="order-topic" name="topic" class="form-select" required>
                    <option value="" selected disabled>Выберите тему</option>
                    <option value="product">Заказ товара</option>
                    <option value="consultation">Консультация</option>
                    <option value="delivery">Доставка</option>
                  </select>
                </div>

                <div class="col-12">
                  <label for="order-comment" class="form-label">Комментарий</label>
                  <textarea id="order-comment" name="comment" class="form-control" rows="4" placeholder="Укажите дополнительную информацию"></textarea>
                </div>

                <div class="col-12">
                  <div class="form-check">
                    <input id="order-agree" class="form-check-input" type="checkbox" required>
                    <label class="form-check-label" for="order-agree">
                      Я согласен на обработку данных *
                    </label>
                  </div>
                </div>

                <div class="col-12 d-flex gap-2">
                  <button class="btn btn-primary" type="submit">Отправить заявку</button>
                  <button class="btn btn-outline-secondary" type="reset">Очистить</button>
                </div>

              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
